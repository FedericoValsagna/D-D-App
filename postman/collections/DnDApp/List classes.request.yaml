$kind: http-request
name: List classes
url: "{{baseUrl}}/api/v1/classes"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();

      pm.test("class catalog listed", function () {
        pm.response.to.have.status(200);
        pm.expect(body).to.have.lengthOf(12);
        const cleric = body.find(c => c.class === "CLERIC");
        pm.expect(cleric.subclassLevel).to.equal(1);
        pm.expect(cleric.subclasses.map(s => s.id)).to.include("LIFE");
      });
order: 15
