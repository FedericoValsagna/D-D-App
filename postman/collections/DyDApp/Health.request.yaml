$kind: http-request
name: Health
url: "{{baseUrl}}/actuator/health"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("server is up", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.equal("UP");
      });
order: 10
