# Override de desarrollo: docker compose -f compose.yaml -f compose.dev.yaml up --build
# Proyecto aparte (contenedores y volumen propios) para que dev nunca toque la base de prod.
name: dndapp-dev

services:
  db:
    ports:
      - "127.0.0.1:5435:5432"
  app:
    ports: !override
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

secrets:
  db_password:
    file: ./secrets/dev_db_password.txt
