spring:
  application:
    name: dydapp
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${db_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

# OpenAPI apagado por defecto; se prende en el perfil dev.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
