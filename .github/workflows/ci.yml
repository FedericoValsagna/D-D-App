name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Compila, corre tests (Testcontainers usa el Docker del runner), ktlint, detekt y verifica coverage.
      - name: Build
        run: ./gradlew build

      - name: Coverage report
        if: always()
        run: ./gradlew koverHtmlReport

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: build/reports/
